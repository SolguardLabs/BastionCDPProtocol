name: Release integrity

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated release tag
        required: true
        default: v1.0.0

permissions:
  contents: read

jobs:
  verify-release:
    name: Verify release references
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "release" ]]; then
            tag="$RELEASE_TAG"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          [[ "$tag" == "v1.0.0" ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify annotated tag, versions and branch parity
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --force origin main production "refs/tags/$TAG:refs/tags/$TAG"
          [[ "$(git cat-file -t "refs/tags/$TAG")" == "tag" ]]
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          production_sha="$(git rev-parse refs/remotes/origin/production)"
          tag_sha="$(git rev-parse "refs/tags/$TAG^{}")"
          [[ "$main_sha" == "$production_sha" ]]
          [[ "$main_sha" == "$tag_sha" ]]
          [[ "$(node -p "require('./package.json').version")" == "1.0.0" ]]
          grep -Fq 'string public constant VERSION = "1.0.0";' src/version/BastionVersion.sol
